<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F4">
<title>LOOK AI · 사진 한 장으로 완성하는 코디</title>
<link rel="manifest" href="manifest.webmanifest">

<link rel="icon" href="icon-512.png" type="image/png" sizes="512x512">
<link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root{--bg:#F1EBDF;--ivory:#FAF8F4;--ink:#111;--mute:rgba(17,17,17,.62);--line:rgba(17,17,17,.13);--sand:#D9CDB8;--taupe:#7A6A55;--card:#F1EBDF;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0b;--ivory:#151412;--ink:#F5F1EA;--mute:rgba(245,241,234,.6);--line:rgba(245,241,234,.15);--sand:#3a352c;--taupe:#b9a98c;--card:#201d19;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0b0b;--ivory:#151412;--ink:#F5F1EA;--mute:rgba(245,241,234,.6);--line:rgba(245,241,234,.15);--sand:#3a352c;--taupe:#b9a98c;--card:#201d19;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:430px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--ivory);padding-bottom:88px}
a{color:inherit;text-decoration:none}
input,button{font-family:inherit}
input[type=text],input[type=email],input[type=password]{font-size:16px}
.pad{padding:0 24px}
.logo{font-family:"Cormorant Garamond",Didot,"Bodoni 72",Georgia,serif;font-size:22px;letter-spacing:.32em;font-weight:500}
.logo b{color:var(--taupe);font-weight:500}
.top{display:flex;justify-content:space-between;align-items:center;padding:20px 24px 0}
.hd{position:relative;display:flex;justify-content:center;align-items:center;height:48px;margin-top:8px}
.hd h1{font-size:15px;font-weight:500;margin:0;letter-spacing:.04em}
.bk{position:absolute;left:8px;width:40px;height:40px;display:flex;align-items:center;justify-content:center}
.steps{display:flex;gap:6px;padding:4px 24px 0}.steps i{flex:1;height:2px;border-radius:2px;background:var(--line)}.steps i.on{background:var(--ink)}
h2.t{font-size:24px;font-weight:300;line-height:1.35;margin:18px 0 8px}
h2.big{font-size:38px;font-weight:300;line-height:1.2;letter-spacing:-.02em;margin:14px 0}
.lbl{font-size:11px;letter-spacing:.3em;color:var(--taupe);margin:0}
.mute{color:var(--mute);font-size:14px;line-height:1.6}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--ink);font-size:15px;font-weight:500;letter-spacing:.03em;cursor:pointer}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.35;pointer-events:none}
.p{background:var(--ink);color:var(--ivory);border-color:var(--ink)}
.btn.sm{height:48px;font-size:14px}
.ic{width:22px;height:22px;flex:none}.btn .ic{width:18px;height:18px}
.hero{position:relative;height:240px;border-radius:28px;background:var(--card);overflow:hidden;margin-top:28px}
.hero svg{position:absolute;width:200px;height:200px}
.dots{position:absolute;left:16px;bottom:16px;display:flex;gap:8px}.dots i{width:28px;height:28px;border-radius:50%;border:1px solid var(--line)}
.how{list-style:none;margin:20px 0 0;padding:0;border-top:1px solid var(--line)}
.how li{display:flex;gap:20px;padding:20px 0;border-bottom:1px solid var(--line)}
.how em{font-family:Georgia,serif;font-style:normal;font-size:24px;color:var(--taupe)}
.how p{margin:0}.how b{font-weight:500}
.ph{position:relative;border-radius:24px;overflow:hidden;background:var(--card);aspect-ratio:3/4}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;display:flex;align-items:center;justify-content:center}
.ph .m{position:absolute;left:12px;bottom:12px;font-size:11px;color:#fff;background:rgba(0,0,0,.65);padding:4px 12px;border-radius:99px}
.drop{aspect-ratio:3/4;border:1px dashed var(--line);border-radius:24px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--taupe)}
.drop .ic{width:40px;height:40px}.drop p{margin:12px 0 0;color:var(--ink);font-weight:500}.drop small{color:var(--mute);margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.err{margin-top:12px;padding:12px 16px;border-radius:16px;background:var(--ink);color:var(--ivory);font-size:14px}
.tips{list-style:none;padding:0;margin:20px 0 0;font-size:13px;color:var(--mute);line-height:1.9}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.sc{min-height:132px;border-radius:24px;border:1px solid var(--line);background:var(--ivory);color:var(--ink);padding:16px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.sc.on{background:var(--ink);color:var(--ivory);border-color:var(--ink)}.sc.lock{opacity:.4}
.sw{display:flex}.sw i{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);margin-right:-6px}
.sc small{display:block;font-size:11px;letter-spacing:.2em;opacity:.55}.sc b{display:block;font-size:15px;font-weight:500;margin:4px 0 2px}.sc span{font-size:12px;opacity:.65}
.ov{position:fixed;inset:0;z-index:50;background:var(--ivory);opacity:.97;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sp{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--ink);animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
.badge{text-align:center;font-size:11px;color:var(--taupe);background:var(--card);border-radius:99px;padding:8px 16px;margin:8px 0 16px}
.row{display:flex;align-items:center;gap:20px}.row img{width:96px;height:116px;border-radius:16px;object-fit:cover;flex:none}
.ring{position:relative;width:112px;height:112px;flex:none}.ring svg{transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.ring b{font:400 30px Georgia,serif}.ring small{font-size:9px;letter-spacing:.15em;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.chips span{background:var(--card);color:var(--taupe);font-size:12px;border-radius:99px;padding:4px 12px}
.box{border:1px solid var(--line);border-radius:16px;padding:16px}.box p{margin:8px 0 0;font-weight:500}
.pal{display:flex;gap:16px;margin-top:12px}.pal div{text-align:center;font-size:11px;color:var(--mute)}.pal i{display:block;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);margin-bottom:6px}
.it{padding:16px 0;border-bottom:1px solid var(--line)}.it:first-child{border-top:1px solid var(--line)}
.it div{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:500}.it small{font-size:12px;color:var(--mute);font-weight:400}
.bar{height:3px;border-radius:3px;background:var(--line);margin-top:8px}.bar i{display:block;height:100%;border-radius:3px;background:var(--ink)}
.tipbox{background:var(--card);border-radius:24px;padding:20px;margin-top:24px;font-size:14px;line-height:1.7}
.oc{border:1px solid var(--line);border-radius:24px;overflow:hidden;margin-top:20px}.oc .cl{display:flex;height:88px}.oc .cl i{flex:1}
.oc .bd{padding:20px}.oc h3{margin:8px 0 0;font-size:18px;font-weight:500}
.oc .hr{position:absolute;right:12px;top:12px;width:40px;height:40px;border:0;background:none;color:var(--ink)}.oc .hr.on svg{fill:currentColor}
.pc{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.pc i{width:16px;height:16px;border-radius:50%;border:1px solid var(--line);flex:none}.pc small{width:44px;color:var(--taupe);font-size:12px}
.why{margin:16px 0 0;padding:12px 16px;border-radius:16px;background:var(--card);font-size:13px;line-height:1.7;color:var(--mute)}
.tab{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:99px;padding:4px;margin-top:20px}.tab button{height:44px;border:0;border-radius:99px;background:none;color:var(--mute);font-size:14px}.tab .on{background:var(--ink);color:var(--ivory)}
.fld{width:100%;height:56px;border-radius:16px;border:1px solid var(--line);background:var(--ivory);color:var(--ink);padding:0 16px;margin-top:14px;outline:none}.fld:focus{border-color:var(--ink)}
.fe{font-size:12px;margin:6px 4px 0;color:var(--mute)}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:13px;color:var(--mute);margin-top:16px}.chk input{width:20px;height:20px;accent-color:var(--ink);margin:0}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;display:grid;grid-template-columns:repeat(5,1fr);background:var(--ivory);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:9}
nav a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;font-size:10px;letter-spacing:.04em;color:var(--mute)}nav a.on{color:var(--ink)}
.seg{display:flex;gap:6px;margin-top:10px}
.seg button{flex:1;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--ivory);color:var(--mute);font-size:13px;font-weight:500;cursor:pointer;padding:0 4px;line-height:1.2}
.seg button.on{background:var(--ink);color:var(--ivory);border-color:var(--ink)}
.chips.sel{margin-top:10px}
.chip{border:1px solid var(--line);background:var(--ivory);color:var(--mute);font-size:13px;border-radius:99px;padding:9px 15px;cursor:pointer;font-weight:500}
.chip.on{background:var(--ink);color:var(--ivory);border-color:var(--ink)}
.hb{border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.hb-top{display:flex;justify-content:space-between;align-items:baseline}
.hb-top b{font:400 26px Georgia,serif}
.hb .bar{margin-top:10px}
.shop{font-size:11px;color:var(--taupe);border:1px solid var(--line);border-radius:99px;padding:6px 11px;flex:none;margin-left:8px;white-space:nowrap;display:inline-flex;align-items:center;min-height:26px}
.pc span{flex:1;min-width:0;line-height:1.35;white-space:normal;overflow-wrap:anywhere}

.board{width:100%;height:auto;display:block;border-radius:20px}
.boardwrap{padding:0 0 4px;position:relative}
.lookcap{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:8px;font-size:12px;color:var(--mute)}
.lookcap b{font-size:14px;color:var(--ink);font-weight:500}
.comps{display:grid;gap:8px;margin-top:10px}
.comp{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--ivory)}
.comp-sw{width:18px;height:18px;border-radius:50%;border:1px solid var(--line);flex:none}
.comp-tx{flex:1;min-width:0}
.comp-tx small{display:block;font-size:10px;letter-spacing:.14em;color:var(--taupe)}
.comp-tx b{display:block;font-size:13.5px;font-weight:500}
.comp-tx span{display:block;font-size:11.5px;color:var(--mute);line-height:1.45;margin-top:2px}
.comp-a{flex:none;font-size:11px;border:1px solid var(--line);border-radius:99px;padding:6px 10px;color:var(--taupe);min-height:26px;display:flex;align-items:center}
.wgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.witem{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:var(--card)}
.witem img{width:100%;height:100%;object-fit:cover;display:block}
.witem .wdel{position:absolute;top:4px;right:4px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center}
.witem .wdel .ic{width:16px;height:16px}
.wcat{position:absolute;left:6px;bottom:6px;border:0;border-radius:99px;background:rgba(255,255,255,.92);color:#111;font-size:11px;padding:7px 11px;font-weight:500;min-height:30px}
.witem small{position:absolute;right:8px;bottom:9px;width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.7)}
.wrow{display:flex;gap:6px;padding:12px 12px 0}
.wrow img{flex:1;min-width:0;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--card)}
/* ---- FULL LOOK: 조합 탭 · 룩보드 · 아이템 카드 · 구매 링크 ---- */
.ltabs{display:flex;gap:8px;overflow-x:auto;margin:14px -24px 0;padding:0 24px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.ltabs::-webkit-scrollbar{display:none}
.ltabs button{flex:none;border:1px solid var(--line);background:var(--ivory);color:var(--ink);border-radius:16px;padding:10px 14px;font-size:12.5px;font-weight:500;line-height:1.3;text-align:left;cursor:pointer;max-width:186px}
.ltabs button b{display:block;font-size:9px;letter-spacing:.18em;font-weight:400;color:var(--taupe);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ltabs button span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.6;font-weight:400;font-size:11px;margin-top:2px}
.ltabs button.on{background:var(--ink);color:var(--ivory);border-color:var(--ink)}
.ltabs button.on b{color:rgba(250,248,244,.55)}
.lb{border:1px solid var(--line);border-radius:26px;padding:14px;margin-top:12px;background:var(--ivory)}
.lb-top{display:flex;gap:14px;align-items:flex-start}
.lb-photo{width:88px;height:112px;border-radius:16px;object-fit:cover;flex:none;background:var(--card)}
.lb-meta{flex:1;min-width:0}
.lb-meta h3{margin:6px 0 0;font-size:19px;font-weight:500;line-height:1.3;letter-spacing:-.01em}
.lb-meta p{margin:6px 0 0;font-size:12px;line-height:1.55;color:var(--mute)}
.lb-colors{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.lb-colors div{text-align:center;min-width:0}
.lb-colors i{display:block;width:100%;height:28px;border-radius:7px;border:1px solid var(--line)}
.lb-colors small{display:block;font-size:8.5px;letter-spacing:.06em;color:var(--taupe);margin-top:5px}
.lb-colors b{display:block;font-size:9.5px;font-weight:500;line-height:1.3;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.lbc{position:relative;border-radius:16px;background:var(--card);padding:22px 6px 8px}
.lbc small{position:absolute;left:9px;top:8px;font-size:8px;letter-spacing:.12em;color:var(--taupe)}
.lbc svg{display:block;width:100%;height:auto;max-height:104px}
.lbc b{display:block;font-size:9.5px;font-weight:500;line-height:1.35;text-align:center;margin-top:4px;min-height:26px;overflow-wrap:anywhere}
.icard{border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-top:10px}
.icard-h{display:flex;align-items:center;gap:10px}
.icard-h i{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);flex:none}
.icard-h div{flex:1;min-width:0}
.icard-h small{display:block;font-size:9px;letter-spacing:.16em;color:var(--taupe)}
.icard-h b{display:block;font-size:15px;font-weight:500;line-height:1.35}
.icard-h span{margin-left:auto;font-size:9.5px;color:var(--mute);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;flex:none}
.icard p{margin:8px 0 0;font-size:12.5px;line-height:1.6}
.icard .fit{color:var(--taupe)}
.icard .fit b{color:var(--ink);font-weight:500}
.icard .why2{color:var(--mute)}
.shops{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:11px}
.shops a{display:flex;align-items:center;justify-content:center;height:38px;border-radius:12px;border:1px solid var(--line);font-size:11.5px;font-weight:500;letter-spacing:.01em}
.shops a:first-child{background:var(--ink);color:var(--ivory);border-color:var(--ink)}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav" aria-label="주요 메뉴"></nav>
<input id="fa" type="file" accept="image/*" hidden>
<input id="fc" type="file" accept="image/*" capture="environment" hidden>
<input id="fw" type="file" accept="image/*" multiple hidden>
<script>
"use strict";
const $=s=>document.querySelector(s);
const ICON={home:'<path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',upload:'<path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>',analysis:'<path d="M5 20V11M12 20V4M19 20v-6"/>',outfit:'<path d="M12 7V5.5a2 2 0 1 0-2-2M12 7l8 5.5a1.5 1.5 0 0 1-.8 2.8H4.8A1.5 1.5 0 0 1 4 12.5z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',back:'<path d="M15 5l-7 7 7 7"/>',img:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M21 16l-5-5-9 9"/>',cam:'<path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/>',heart:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',ok:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',bookmark:'<path d="M6 4h12v17l-6-4.5L6 21z"/>',share:'<path d="M12 3v12M8 7l4-4 4 4M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/>',spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',body:'<circle cx="12" cy="4.5" r="2.2"/><path d="M12 7v7M7 10l5-1 5 1M12 14l-3.5 7M12 14l3.5 7"/>'};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;

const STY=[
 ["minimal","미니멀","MINIMAL","절제된 라인, 무채색 톤",["#F5F1EA","#D9CDB8","#111"]],
 ["casual","캐주얼","CASUAL","편안한 데일리 무드",["#E9E1D3","#8C7B65","#3A3A3A"]],
 ["street","스트릿","STREET","오버핏과 레이어드",["#1A1A1A","#6E6A63","#CBBBA0"]],
 ["classic","클래식","CLASSIC","단정한 테일러드 실루엣",["#EFE8DC","#4A3F33","#111"]],
 ["business","비즈니스 캐주얼","BUSINESS","출근룩, 깔끔한 셋업",["#D9D4CA","#2B2B2B","#FAF8F4"]],
 ["smart","스마트 캐주얼","SMART","격식과 편안함의 균형",["#CBBBA0","#5B5247","#F5F1EA"]]

/* ---------- 색 계산 ---------- */
function rgb(c){return Array.isArray(c)?c:hex2rgb(c)}
function hex2rgb(h){h=h.replace("#","");if(h.length===3)h=h.split("").map(x=>x+x).join("");return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
const hex=c=>"#"+c.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join("");
function hsl(c){let[r,g,b]=rgb(c).map(v=>v/255);const M=Math.max(r,g,b),m=Math.min(r,g,b),l=(M+m)/2,d=M-m;let h=0,s=0;if(d){s=d/(1-Math.abs(2*l-1));h=M===r?((g-b)/d+6)%6:M===g?(b-r)/d+2:(r-g)/d+4;h*=60}return{h,s,l}}
function lab(c){let[r,g,b]=rgb(c).map(v=>{v/=255;return v>.04045?Math.pow((v+.055)/1.055,2.4):v/12.92});
 r*=100;g*=100;b*=100;
 let x=(r*.4124+g*.3576+b*.1805)/95.047,y=(r*.2126+g*.7152+b*.0722)/100,z=(r*.0193+g*.1192+b*.9505)/108.883;
 const f=t=>t>.008856?Math.cbrt(t):7.787*t+16/116;
 x=f(x);y=f(y);z=f(z);
 return{L:116*y-16,a:500*(x-y),b:200*(y-z)}}
const dE=(a,b)=>{const x=lab(a),y=lab(b);return Math.sqrt((x.L-y.L)**2+(x.a-y.a)**2+(x.b-y.b)**2)};
function cname(c){const{h,s,l}=hsl(c);
 if(l<.13)return"블랙";if(l>.86)return s<.25?"화이트":"크림";
 if(s<.12)return l<.3?"차콜":l<.62?"그레이":"라이트그레이";
 if(h<15||h>=345)return l<.32?"버건디":"레드";
 if(h<45)return l<.28?"다크브라운":(s<.4&&l>.6)?"베이지":l<.45?"브라운":"카멜";
 if(h<70)return s<.45?"카키":"머스터드";
 if(h<165)return l<.3?"다크그린":s<.28?"카키":"그린";
 if(h<200)return l<.3?"틸":"민트";
 if(h<260)return l<.28?"네이비":l<.55?"데님":"블루";
 if(h<300)return"퍼플";return l<.35?"버건디":"핑크"}
function family(c){const{h,s,l}=hsl(c);if(s<.14||l<.12||l>.9)return"뉴트럴";return(h<70||h>=330)?"웜":"쿨"}

const GW=90,GH=120;
const st=[];
function px(x,y){const i=(y*GW+x)*4;return[ST.px[i],ST.px[i+1],ST.px[i+2]]}
function region(x0,y0,x1,y1){
 const pts=[];
 for(let y=y0;y<y1;y+=1)for(let x=x0;x<x1;x+=1)pts.push(px(x,y));
 if(pts.length<20)return null;
 let cs=[];
 for(let k=0;k<3;k++){const p=pts[Math.floor(pts.length*(k+1)/4)];cs.push([p[0]+k*2,p[1]+k,p[2]+k])}
 for(let it=0;it<7;it++){
  const g=cs.map(()=>[0,0,0,0]);
  for(const p of pts){
   let bi=0,bd=1e9;
   for(let k=0;k<cs.length;k++){const d=(p[0]-cs[k][0])**2+(p[1]-cs[k][1])**2+(p[2]-cs[k][2])**2;if(d<bd){bd=d;bi=k}}
   g[bi][0]++;g[bi][1]+=p[0];g[bi][2]+=p[1];g[bi][3]+=p[2];
  }
  g.forEach((s,i)=>{if(s[0])cs[i]=[s[1]/s[0],s[2]/s[0],s[3]/s[0]]});
 }
 const g=cs.map((c,i)=>({c,n:0}));
 const counts=cs.map(()=>0);
 for(const p of pts){let bi=0,bd=1e9;for(let k=0;k<cs.length;k++){const d=(p[0]-cs[k][0])**2+(p[1]-cs[k][1])**2+(p[2]-cs[k][2])**2;if(d<bd){bd=d;bi=k}}counts[bi]++}
 const order=counts.map((n,i)=>({c:cs[i].map(Math.round),n})).sort((a,b)=>b.n-a.n);
 const top=order[0],share=top.n/pts.length;
 return{rgb:top.c,share,alts:order.slice(1).map(o=>({hex:hex(o.c),share:o.n/pts.length}))};
}
function splitRow(){
 let best=Math.round(GH*.46),bestD=0;
 for(let y=Math.round(GH*.36);y<Math.round(GH*.6);y++){
  const a=region(24,y-10,66,y-2),b=region(24,y+2,66,y+10);
  if(!a||!b)continue;
  const d=dE(hex(a.rgb),hex(b.rgb));
  if(d>bestD){bestD=d;best=y}
 }
 return best;
}
function analyze(){
 const yy=splitRow();
 const regs=[["상의",[22,Math.round(GH*.2),68,yy-2]],["하의",[24,yy+2,66,Math.round(GH*.72)]],["신발",[20,Math.round(GH*.76),70,Math.round(GH*.86)]]];
 const items=regs.map(([cat,r])=>{
   const d=region(r[0],r[1],r[2],r[3]);
   if(!d)return null;
   const h=hsl(d.rgb);
   return{cat,hex:hex(d.rgb),color:cname(d.rgb),conf:Math.min(96,Math.round(52+d.share*52+(d.alts[0]?d.alts[0].share*12:0))),...h,share:d.share};
 }).filter(Boolean);
 const[top,bot]=items;
 if(!top||!bot)return null;
 const dl=Math.abs(top.l-bot.l),dh=Math.abs(top.h-bot.h),neu=items.filter(i=>i.s<.2).length/items.length;
 const warm=items.filter(i=>i.s>=.2&&(i.h<70||i.h>=330)).length,cool=items.filter(i=>i.s>=.2&&i.h>=70&&i.h<330).length;
 const tone=neu>=.67?"뉴트럴":warm>=cool?"웜 톤":"쿨 톤";
 const con=dl>.42?"하이 콘트라스트":dl<.18?"톤온톤":"밸런스";
 const av=(top.l+bot.l)/2,br=av<.3?"다크":av>.65?"라이트":"미디엄";
 const d=dE(top.hex,bot.hex);
 let hscore=84,hnote="상하의 색 거리가 적당해 안정적으로 읽혀요.";
 if(con==="톤온톤"){hscore=90;hnote="톤온톤이라 차분하고 단정해 보여요. 소재 차이로 입체감을 주세요."}

function kindOf(name,cat){
 const n=String(name||"");

 if(/목걸이|체인|펜던트|네크리스/.test(n))return"necklace";
 if(/안경|선글라스|글라스/.test(n))return"glasses";
 if(/이어폰|이어버드|헤드폰/.test(n))return"earbuds";
 if(/시계|워치/.test(n))return"watch";
 if(/벨트|띠/.test(n))return"belt";
 if(/비니|바라클라바/.test(n))return"beanie";
 if(cat==="상의"){ // 상의 슬롯은 겉옷처럼 보이지 않도록 상의 실루엣으로 그립니다
  if(/니트|스웨터|맨투맨|후드|집업|스웻|폴로|가디건|카디건/.test(n))return"knit";
  if(/셔츠|옥스포드/.test(n))return"shirt";
  if(/티셔츠|반팔|무지 티/.test(n))return"tee";
 }
 if(/패딩/.test(n))return"puffer";
 if(/코트|트렌치/.test(n))return"outer";
 if(/재킷|자켓|블레이저|블루종|집업|바람막이|셋업|베스트/.test(n))return"outer";
 if(/니트|스웨터|맨투맨|후드|가디건|폴로|집업/.test(n))return"knit";
 if(/셔츠|옥스포드/.test(n))return"shirt";
 if(/티셔츠|티\b|반팔/.test(n))return"tee";
 if(/데님|청바지/.test(n))return"denim";
 if(/쇼츠|버뮤다|반바지/.test(n))return"shorts";
 if(/부츠/.test(n))return"boots";
 if(/가방|백|크로스|토트|에코백|파우치/.test(n))return"bag";
 if(/로퍼|구두|더비|옥스퍼드|메리제인/.test(n))return"loafer";
 if(/스니커즈|러닝화|슬립온|슬라이드|샌들|캔버스/.test(n))return"sneakers";
 if(/모자|볼캡|버킷햇|캡/.test(n))return"hat";
 if(cat==="액세서리")return"bag";
 if(cat==="하의")return"pants";
 if(cat==="신발")return"sneakers";
 return"tee";
}

async function addWardrobe(files){
 for(const f of [...files].slice(0,8)){
  if(!f.type.startsWith("image/"))continue;
  try{
   const u=URL.createObjectURL(f);
   const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=u});
   const s=Math.min(1,320/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*s)),h=Math.max(1,Math.round(img.naturalHeight*s));
   const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");
   x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
   const t=document.createElement("canvas");t.width=12;t.height=12;const tx=t.getContext("2d",{willReadFrequently:true});tx.drawImage(img,0,0,12,12);
   const d=tx.getImageData(0,0,12,12).data;let r=0,g=0,b=0,n=0;
   for(let i=0;i<d.length;i+=4){const br=(d[i]+d[i+1]+d[i+2])/3;if(br>245)continue;r+=d[i];g+=d[i+1];b+=d[i+2];n++}
   if(!n){r=g=b=200;n=1}
   const col=hex([r/n,g/n,b/n]);
   ST.wardrobe.unshift({id:"w"+Date.now()+Math.random().toString(36).slice(2,6),src:c.toDataURL("image/jpeg",.62),cat:"상의",name:"내 상의",color:cname(col),hex:col});
   URL.revokeObjectURL(u);
  }catch(e){}
 }
 wsave();render(true);
}

 if(!tops.length||!bots.length)return{err:"상의와 하의를 각각 1장 이상 등록해 주세요."};
 const pairs=[];

  const d=dE(t.hex,b.hex),dl=Math.abs(hsl(t.hex).l-hsl(b.hex).l);

  if(d<20)s+=4; if(d>72)s-=12; if(dl<.12)s-=6;
  if(family(t.hex)===family(b.hex))s+=4;
  s+=Math.random()*4;
  const sh=shoes.slice().sort((x,y)=>Math.abs(dE(x.hex,b.hex)-14)-Math.abs(dE(y.hex,b.hex)-14))[0]||null;
  pairs.push({t,b,sh,s});
 }));
 pairs.sort((a,b)=>b.s-a.s);
 const seen=new Set(),picked=[];
 for(const p of pairs){const k=p.t.id+"|"+p.b.id;if(seen.has(k))continue;seen.add(k);picked.push(p);if(picked.length===3)break}
 const cold=ST.wea==="cold";
 return{list:picked.map((p,i)=>{
  const o=cold?(outers.slice().sort((x,y)=>hsl(x.hex).l-hsl(y.hex).l)[0]||null):null;
  const pcs=[];
  if(o)pcs.push(["아우터",o.name||(o.color+" 아우터"),o.hex]);
  pcs.push(["상의",p.t.name||(p.t.color+" 상의"),p.t.hex],["하의",p.b.name||(p.b.color+" 하의"),p.b.hex]);
  if(p.sh)pcs.push(["신발",p.sh.name||(p.sh.color+" 신발"),p.sh.hex]);
  const d=Math.round(dE(p.t.hex,p.b.hex));
  const why=`${p.t.color} 상의와 ${p.b.color} 하의 조합. 색 거리 ${d}로 ${d<22?"톤온톤에 가까워 차분해요":d>58?"대비가 커서 또렷한 인상이에요":"균형이 잡힌 조합이에요"}.`+(p.sh?` 신발은 ${p.sh.color}로 발끝을 정리했어요.`:"");
  return{id:"w"+i,title:`${p.t.color} × ${p.b.color}`,occ:"내 옷 조합",pcs,why,score:Math.max(66,Math.min(96,Math.round(p.s))),
   photos:[p.t,p.b,p.sh,o].filter(Boolean).map(x=>x.src)};
 })};
}

<div class="tipbox"><p class="lbl">키 발급</p>1) aistudio.google.com 접속 후 로그인<br>2) "Get API key"로 키 생성<br>3) 위 칸에 붙여 넣고 저장<br><br><span class="mute">· 무료 티어로 보낸 사진은 Google 제품 개선에 쓰일 수 있어요.<br>· 키는 본인 기기에만 두고, 남에게 공유하지 마세요.<br>· LOOK AI 서버가 연결되면 키 없이 Gemini AI 분석을 쓸 수 있어요.<br>· AI 코디 이미지 생성은 결제가 활성화된 Gemini 키가 있어야 동작해요(1장 약 $0.03~0.07).</span></div></section>`,
 auth:()=>{if(ST.user)return`${head("계정","home")}<section class="pad" style="padding-top:24px"><div class="tipbox" style="margin:0"><p class="lbl">SIGNED IN</p><p style="font-size:20px;font-weight:300;margin:12px 0 4px">${ST.user.name}님</p><span class="mute">${ST.user.email}</span></div><a class="btn" style="margin-top:16px" href="#saved">내 룩북 ${ST.looks.length}개</a><button class="btn" style="margin-top:12px" data-a="out">로그아웃</button><a class="btn" style="margin-top:12px" href="#ai">AI 설정</a></section>`;
const s=ST.mode==="signup",e=ST.fe,E=k=>e[k]?`<p class="fe">⚠ ${e[k]}</p>`:"";return`${head(s?"회원가입":"로그인","home")}<section class="pad"><h2 class="t">${s?"나만의 스타일링을<br>시작해 볼까요":"다시 만나서<br>반가워요"}</h2>
<div class="tab" role="tablist"><button role="tab" class="${s?"":"on"}" data-a="mode" data-id="login">로그인</button><button role="tab" class="${s?"on":""}" data-a="mode" data-id="signup">회원가입</button></div>
<form id="af" novalidate>${s?`<input class="fld" name="name" placeholder="이름" autocomplete="name" aria-label="이름" value="${ST.f.name}">${E("name")}`:""}
<input class="fld" name="email" type="email" inputmode="email" autocapitalize="none" autocomplete="email" placeholder="이메일" aria-label="이메일" value="${ST.f.email}">${E("email")}
<input class="fld" name="pw" type="password" autocomplete="${s?"new-password":"current-password"}" placeholder="비밀번호 (영문+숫자 8자 이상)" aria-label="비밀번호">${E("pw")}
${s?`<label class="chk"><input type="checkbox" name="ag">이용약관 및 개인정보 처리방침에 동의합니다. (필수)</label>${E("ag")}`:""}
${ST.err?`<p class="err" role="alert">${ST.err}</p>`:""}<button class="btn p" style="margin-top:20px" type="submit">${s?"가입하기":"로그인"}</button></form>
<p class="mute" style="font-size:11px;text-align:center;margin-top:24px">데모 계정은 이 기기 안에만 저장돼요.</p><a class="btn" style="margin-top:16px" href="#ai">AI 설정</a></section>`}};

/* ---------- 라우터 · 이벤트 ---------- */
const go=r=>location.replace("#"+r);
function render(keep){let r=location.hash.slice(1)||"home";if(!V[r])r="home";
 if(r==="profile"&&!ST.photo)return go("upload");
 if(r==="style"&&!ST.photo)return go("upload");
 if((r==="result"||r==="outfits")&&!ST.result)return go(ST.photo?"style":"upload");
 const y=scrollY;$("#app").innerHTML=V[r]();
 $("#nav").innerHTML=[["home","홈","home"],["upload","업로드","upload"],["wardrobe","옷장","outfit"],["result","분석","analysis"],["saved","룩북","bookmark"]].map(n=>`<a href="#${n[0]}" class="${n[0]===r||(r==="profile"&&n[0]==="upload")||(r==="style"&&n[0]==="upload")?"on":""}">${ic(n[2])}${n[1]}</a>`).join("");
 scrollTo(0,keep===true?y:0)}

addEventListener("hashchange",()=>{ST.err="";ST.fe={};render()});

function saveLooks(){try{localStorage.setItem("lookai:looks",JSON.stringify(ST.looks))}catch(e){}}
function saveProfile(){try{localStorage.setItem("lookai:profile",JSON.stringify(ST.profile))}catch(e){}}
async function shareText(t){
 try{if(navigator.share){await navigator.share({text:t});return true}
  await navigator.clipboard.writeText(t);alert("클립보드에 복사했어요.");return true}
 catch(e){try{prompt("복사해서 사용하세요",t)}catch(x){}return false}
}
const lookText=l=>`${l.title} (${l.occ})\n`+l.pcs.map(p=>`· ${p[0]} ${p[1]}`).join("\n")+`\n\nLOOK AI`;

async function loadFile(f){ST.err="";if(!f||!f.type.startsWith("image/")){ST.err="이미지 파일만 올릴 수 있어요.";return render(true)}
 const u=URL.createObjectURL(f);
 try{
  const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=u});
  const s=Math.min(1,1280/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*s),h=Math.round(img.naturalHeight*s),c=document.createElement("canvas");
  c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
  ST.photo=c.toDataURL("image/jpeg",.85);
  const g=document.createElement("canvas");g.width=GW;g.height=GH;
  const gx=g.getContext("2d",{willReadFrequently:true});gx.fillStyle="#fff";gx.fillRect(0,0,GW,GH);
  // 중앙 크롭으로 인물 비중을 높임
  const ar=img.naturalWidth/img.naturalHeight;
  let sw=img.naturalWidth,sh=img.naturalHeight,sx=0,sy=0;
  if(ar>0.85){sw=img.naturalHeight*0.85;sx=(img.naturalWidth-sw)/2}
  gx.drawImage(img,sx,sy,sw,sh,0,0,GW,GH);
  ST.px=gx.getImageData(0,0,GW,GH).data;
  ST.result=null;ST.meta=`${w}×${h} · ${Math.round(ST.photo.length*.75/1024)}KB`;
 }catch(e){ST.err="사진을 읽을 수 없어요. JPG 또는 PNG로 다시 시도해 주세요."}
 finally{URL.revokeObjectURL(u)}
 render(true)}

for(const id of["fa","fc"])$("#"+id).addEventListener("change",e=>{loadFile(e.target.files[0]);e.target.value=""});
$("#fw").addEventListener("change",e=>{addWardrobe(e.target.files);e.target.value=""});

const sha=async s=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))].map(x=>x.toString(16).padStart(2,"0")).join("");
const store=(k,v)=>{try{v===undefined?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const users=()=>{try{return JSON.parse(localStorage.getItem("lookai:users"))||{}}catch(e){return{}}};

$("#app").addEventListener("click",async e=>{
 const b=e.target.closest("[data-a]");if(!b)return;
 const a=b.dataset.a,id=b.dataset.id;
 if(a==="album")$("#fa").click();
 else if(a==="cam")$("#fc").click();
 else if(a==="del"){ST.photo=null;ST.px=null;ST.result=null;render(true)}
 else if(a==="pf"){const k=b.dataset.k,v=b.dataset.v;if(k==="tpo"||k==="wea"){ST[k]=v}else{ST.profile[k]=v;saveProfile()}render(true)}
 else if(a==="sty"){const i=ST.styles.indexOf(id);if(i>=0)ST.styles.splice(i,1);else if(ST.styles.length<3)ST.styles.push(id);render(true)}
 else if(a==="go"){
  ST.busy=true;ST.msg=0;render(true);
  const t=setInterval(()=>{ST.msg++;if(ST.busy)render(true)},1100);
  ST.note="";
  const ai=(await Promise.all([runAI().catch(()=>null),new Promise(r=>setTimeout(r,2400))]))[0];
  clearInterval(t);
  const base=ai||analyze();
  if(!base){ST.busy=false;ST.err="사진에서 옷 영역을 찾지 못했어요. 전신 사진으로 다시 시도해 주세요.";ST.result=null;go("upload");return}
  if(!Array.isArray(base.outfits)||!base.outfits.length)base.outfits=buildOutfits(base);
  ST.active=0;
  ST.result=base;ST.busy=false;go("result")}
 else if(a==="lk"){ST.active=Math.max(0,+id||0);render(true)}
 else if(a==="jump"){const el=document.getElementById("set-"+id);if(el)el.scrollIntoView({behavior:"smooth",block:"start"})} else if(a==="save"){
  const x=ST.result.outfits.find(o=>o.id===id);
  if(x){if(ST.saved.has(id)){ST.saved.delete(id);ST.looks=ST.looks.filter(l=>l.id!==id)}
   else{ST.saved.add(id);ST.looks.unshift({id,title:x.title,occ:x.occ,why:x.why,pcs:x.pcs,at:Date.now()})}
   saveLooks()}
  render(true)}
 else if(a==="unsave"){ST.saved.delete(id);ST.looks=ST.looks.filter(l=>l.id!==id);saveLooks();render(true)}
 else if(a==="sharel"){const l=ST.looks.find(x=>x.id===id);if(l)shareText(lookText(l))}
 else if(a==="shareall"){shareText(ST.result.outfits.map(lookText).join("\n\n")+`\n\n${TPO[ST.tpo]} · ${WEA[ST.wea]}`)}
 else if(a==="wadd")$("#fw").click();
 else if(a==="wdel"){ST.wardrobe=ST.wardrobe.filter(w=>w.id!==id);ST.wcombos=null;wsave();render(true)}
 else if(a==="wcat"){const w=ST.wardrobe.find(x=>x.id===id);if(w){w.cat=cycleCat(w.cat);w.name="내 "+w.cat;wsave();ST.wcombos=null}render(true)}
 else if(a==="wgo"){ST.wcombos=wardrobeCombos();render(true)}
 else if(a==="aiimg"){const x=ST.result.outfits.find(o=>o.id===id);if(x){b.disabled=true;b.textContent="생성 중…";await makeImage(x);render(true)}}
 else if(a==="reset"){ST.photo=null;ST.px=null;ST.result=null;ST.styles=[];go("upload")}
 else if(a==="mode"){ST.mode=id;ST.fe={};ST.err="";render(true)}
 else if(a==="delkey"){ST.key="";try{localStorage.removeItem("lookai:gkey")}catch(x){}render(true)}
 else if(a==="out"){ST.user=null;store("lookai:user");render(true)}
});

$("#app").addEventListener("submit",async e=>{
 e.preventDefault();
 if(e.target.id==="kf"){const k=new FormData(e.target);
  ST.key=String(k.get("key")||"").trim().replace(/[^\w-]/g,"");
  ST.model=String(k.get("model")||"").trim().replace(/[^\w.\-]/g,"")||"gemini-3.8-flash";
  try{ST.key?localStorage.setItem("lookai:gkey",ST.key):localStorage.removeItem("lookai:gkey");localStorage.setItem("lookai:gmodel",ST.model)}catch(x){}
  return go(ST.photo&&ST.styles.length?"style":"auth")}
 const f=new FormData(e.target),s=ST.mode==="signup",name=(f.get("name")||"").trim(),email=(f.get("email")||"").trim().toLowerCase(),pw=f.get("pw")||"";
 ST.f={name,email};ST.err="";const fe={};
 if(s&&(name.length<2||name.length>20))fe.name="이름은 2~20자로 입력해 주세요.";
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email))fe.email="올바른 이메일 형식이 아니에요.";
 if(pw.length<8||!/[A-Za-z]/.test(pw)||!/\d/.test(pw))fe.pw="영문과 숫자를 포함해 8자 이상 입력해 주세요.";
 if(s&&!f.get("ag"))fe.ag="약관에 동의해 주세요.";
 ST.fe=fe;if(Object.keys(fe).length)return render(true);
 try{const h=await sha("lookai|"+email+"|"+pw),U=users();
  if(s){if(U[email]){ST.err="이미 가입된 이메일이에요.";return render(true)}U[email]={name,h};store("lookai:users",U);ST.user={name,email}}
  else{if(!U[email]||U[email].h!==h){ST.err="이메일 또는 비밀번호가 맞지 않아요.";return render(true)}ST.user={name:U[email].name,email}}
  store("lookai:user",ST.user);go("home")}
 catch(x){ST.err="이 환경에서는 계정 기능을 사용할 수 없어요.";render(true)}
});

render();
checkServer().then(()=>{const r=location.hash.slice(1);if(r==="style"||r==="ai")render(true)});
</script>
</body>
